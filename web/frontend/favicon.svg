  <ellipse cx="32" cy="36" rx="14" ry="18" fill="#F59E0B"/>
  <!-- Stripes -->
  <rect x="18" y="30" width="28" height="6" rx="3" fill="#1C1917" opacity="0.85"/>
  <rect x="19" y="41" width="26" height="5" rx="2.5" fill="#1C1917" opacity="0.85"/>
  <!-- Head -->
  <ellipse cx="32" cy="18" rx="9" ry="8" fill="#F59E0B"/>
  <!-- Eyes -->
  <circle cx="28.5" cy="16.5" r="2.5" fill="#1C1917"/>
  <circle cx="35.5" cy="16.5" r="2.5" fill="#1C1917"/>
  <circle cx="29.2" cy="15.8" r="0.8" fill="white"/>
  <circle cx="36.2" cy="15.8" r="0.8" fill="white"/>
  <!-- Antennae -->
  <line x1="28" y1="11" x2="22" y2="4" stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>
  <circle cx="22" cy="4" r="2" fill="#F59E0B" stroke="#1C1917" stroke-width="1.5"/>
  <line x1="36" y1="11" x2="42" y2="4" stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="4" r="2" fill="#F59E0B" stroke="#1C1917" stroke-width="1.5"/>
  <!-- Left wing -->
