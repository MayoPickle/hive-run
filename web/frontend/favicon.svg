  <!-- Right wing -->
  <ellipse cx="50" cy="26" rx="10" ry="6" fill="white" opacity="0.85" transform="rotate(25 50 26)"/>
  <!-- Stinger -->
  <path d="M32 54 L29 60 L32 58 L35 60 Z" fill="#D97706"/>
